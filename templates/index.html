<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédiction Défaut Prêt Immobilier | EHTP</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 30px;
            text-align: center;
        }
        header h1 { font-size: 2.3rem; margin-bottom: 8px; }
        .form-container { padding: 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 22px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
        }
        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
        }
        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
        }
        .result {
            margin-top: 35px;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }
        .success { background: #ecfdf5; border: 2px solid var(--success); color: #065f46; }
        .danger { background: #fef2f2; border: 2px solid var(--danger); color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Prédiction du Défaut de Remboursement</h1>
            <p>Modèle XGBoost — Projet MSDE7 | EHTP</p>
        </header>

        <div class="form-container">
            <form action="/predict" method="POST">
                <div class="grid">
                    <!-- Champs avec accès sécurisé pour les clés contenant des tirets -->
                    <div class="form-group">
                        <label>year</label>
                        <select name="year">
                            {% for y in [2019,2020,2021,2022,2023,2024] %}<option value="{{ y }}" {% if form_data and form_data.year == y %}selected{% endif %}>{{ y }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group"><label>loan_limit</label><select name="loan_limit">{% for v in ['cf','ncf'] %}<option value="{{v}}" {% if form_data and form_data.loan_limit == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>Gender</label><select name="Gender">{% for v in ['Male','Female','Sex Not Available','Joint'] %}<option value="{{v}}" {% if form_data and form_data.Gender == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>approv_in_adv</label><select name="approv_in_adv">{% for v in ['pre','nopre'] %}<option value="{{v}}" {% if form_data and form_data.approv_in_adv == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>loan_type</label><select name="loan_type">{% for v in ['type1','type2','type3'] %}<option value="{{v}}" {% if form_data and form_data.loan_type == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>loan_purpose</label><select name="loan_purpose">{% for v in ['p1','p2','p3','p4'] %}<option value="{{v}}" {% if form_data and form_data.loan_purpose == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>Credit_Worthiness</label><select name="Credit_Worthiness">{% for v in ['l1','l2'] %}<option value="{{v}}" {% if form_data and form_data.Credit_Worthiness == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>open_credit</label><select name="open_credit">{% for v in ['nopc','opc'] %}<option value="{{v}}" {% if form_data and form_data.open_credit == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>business_or_commercial</label><select name="business_or_commercial">{% for v in ['nob/c','b/c'] %}<option value="{{v}}" {% if form_data and form_data.business_or_commercial == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>

                    <div class="form-group"><label>loan_amount</label><input type="number" name="loan_amount" value="{{ form_data.loan_amount if form_data else 200000 }}"></div>
                    <div class="form-group"><label>term</label><input type="number" name="term" value="{{ form_data.term if form_data else 360 }}"></div>
                    <div class="form-group"><label>property_value</label><input type="number" name="property_value" value="{{ form_data.property_value if form_data else 250000 }}"></div>
                    <div class="form-group"><label>income</label><input type="number" name="income" value="{{ form_data.income if form_data else 5000 }}"></div>
                    <div class="form-group"><label>Credit_Score</label><input type="number" name="Credit_Score" value="{{ form_data.Credit_Score if form_data else 700 }}"></div>
                    <div class="form-group"><label>LTV</label><input type="number" step="0.1" name="LTV" value="{{ form_data.LTV if form_data else 80.0 }}"></div>
                    <div class="form-group"><label>dtir1</label><input type="number" step="0.1" name="dtir1" value="{{ form_data.dtir1 if form_data else 40.0 }}"></div>

                    <div class="form-group"><label>Neg_ammortization</label><select name="Neg_ammortization">{% for v in ['not_neg','neg_amm'] %}<option value="{{v}}" {% if form_data and form_data.Neg_ammortization == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>interest_only</label><select name="interest_only">{% for v in ['not_int','int_only'] %}<option value="{{v}}" {% if form_data and form_data.interest_only == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>lump_sum_payment</label><select name="lump_sum_payment">{% for v in ['not_lpsm','lpsm'] %}<option value="{{v}}" {% if form_data and form_data.lump_sum_payment == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>construction_type</label><select name="construction_type">{% for v in ['sb','mh'] %}<option value="{{v}}" {% if form_data and form_data.construction_type == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>occupancy_type</label><select name="occupancy_type">{% for v in ['pr','sr','ir'] %}<option value="{{v}}" {% if form_data and form_data.occupancy_type == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>Secured_by</label><select name="Secured_by">{% for v in ['home','land'] %}<option value="{{v}}" {% if form_data and form_data.Secured_by == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>total_units</label><select name="total_units">{% for v in ['1U','2U','3U','4U'] %}<option value="{{v}}" {% if form_data and form_data.total_units == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>credit_type</label><select name="credit_type">{% for v in ['EXP','EQUI','CRIF','CIB'] %}<option value="{{v}}" {% if form_data and form_data.credit_type == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>co-applicant_credit_type</label>
                        <select name="co-applicant_credit_type">
                            <option value="CIB" {% if form_data and form_data['co-applicant_credit_type'] == 'CIB' %}selected{% endif %}>CIB</option>
                            <option value="EXP" {% if form_data and form_data['co-applicant_credit_type'] == 'EXP' %}selected{% endif %}>EXP</option>
                        </select>
                    </div>
                    <div class="form-group"><label>age</label><select name="age">{% for v in ['<25','25-34','35-44','45-54','55-64','65-74','>74'] %}<option value="{{v}}" {% if form_data and form_data.age == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>submission_of_application</label><select name="submission_of_application">{% for v in ['to_inst','not_inst'] %}<option value="{{v}}" {% if form_data and form_data.submission_of_application == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>Region</label><select name="Region">{% for v in ['North','south','central','North-East'] %}<option value="{{v}}" {% if form_data and form_data.Region == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                    <div class="form-group"><label>Security_Type</label><select name="Security_Type">{% for v in ['direct','Indriect'] %}<option value="{{v}}" {% if form_data and form_data.Security_Type == v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div>
                </div>

                <button type="submit">Prédire le Risque de Défaut de Rembourssement</button>
            </form>

            {% if result %}
            <div class="result {% if result.prediction == 1 %}danger{% else %}success{% endif %}" id="result-section">
                <h2>{{ result.label }}</h2>
                <h1 style="font-size: 3.5rem; margin: 15px 0;">{{ result.proba_default }}%</h1>
                <p><strong>Niveau :</strong> {{ result.risque_niveau }}</p>
            </div>
            {% endif %}

            {% if error %}
            <div class="error" style="color:red; padding:15px; background:#fee2e2; border-radius:8px;">{{ error }}</div>
            {% endif %}
        </div>
    </div>
    
    <!-- Script pour scroll automatique vers les résultats -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Si on a un résultat (après POST), on scroll vers lui
            if (document.getElementById("result-section")) {
                document.getElementById("result-section").scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }
        });
    </script>
</body>
</html>
