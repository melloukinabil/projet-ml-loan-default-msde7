<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédiction Défaut Prêt Immobilier | EHTP</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 30px;
            text-align: center;
        }
        header h1 { font-size: 2.3rem; margin-bottom: 8px; }
        .form-container { padding: 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 22px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #374151;
            font-size: 0.95rem;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
        }
        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
        }
        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
        }
        .result {
            margin-top: 35px;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }
        .success { background: #ecfdf5; border: 2px solid var(--success); color: #065f46; }
        .danger { background: #fef2f2; border: 2px solid var(--danger); color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Prédiction du Défaut de Remboursement</h1>
            <p>Modèle XGBoost — Projet MSDE7 | EHTP</p>
        </header>

        <div class="form-container">
            <form action="/predict" method="POST">
                <div class="grid">
                    <!-- Tous les champs techniques -->
                    <div class="form-group">
                        <label>year</label>
                        <select name="year">
                            {% for y in [2019,2020,2021,2022,2023,2024] %}<option value="{{ y }}" {% if form_data and form_data.year == y %}selected{% endif %}>{{ y }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>loan_limit</label>
                        <select name="loan_limit">
                            <option value="cf" {% if form_data and form_data.loan_limit == 'cf' %}selected{% endif %}>cf</option>
                            <option value="ncf" {% if form_data and form_data.loan_limit == 'ncf' %}selected{% endif %}>ncf</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select name="Gender">
                            <option value="Male" {% if form_data and form_data.Gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if form_data and form_data.Gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Sex Not Available" {% if form_data and form_data.Gender == 'Sex Not Available' %}selected{% endif %}>Sex Not Available</option>
                            <option value="Joint" {% if form_data and form_data.Gender == 'Joint' %}selected{% endif %}>Joint</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>approv_in_adv</label>
                        <select name="approv_in_adv">
                            <option value="pre" {% if form_data and form_data.approv_in_adv == 'pre' %}selected{% endif %}>pre</option>
                            <option value="nopre" {% if form_data and form_data.approv_in_adv == 'nopre' %}selected{% endif %}>nopre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>loan_type</label>
                        <select name="loan_type">
                            <option value="type1" {% if form_data and form_data.loan_type == 'type1' %}selected{% endif %}>type1</option>
                            <option value="type2" {% if form_data and form_data.loan_type == 'type2' %}selected{% endif %}>type2</option>
                            <option value="type3" {% if form_data and form_data.loan_type == 'type3' %}selected{% endif %}>type3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>loan_purpose</label>
                        <select name="loan_purpose">
                            <option value="p1" {% if form_data and form_data.loan_purpose == 'p1' %}selected{% endif %}>p1</option>
                            <option value="p2" {% if form_data and form_data.loan_purpose == 'p2' %}selected{% endif %}>p2</option>
                            <option value="p3" {% if form_data and form_data.loan_purpose == 'p3' %}selected{% endif %}>p3</option>
                            <option value="p4" {% if form_data and form_data.loan_purpose == 'p4' %}selected{% endif %}>p4</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Credit_Worthiness</label>
                        <select name="Credit_Worthiness">
                            <option value="l1" {% if form_data and form_data.Credit_Worthiness == 'l1' %}selected{% endif %}>l1</option>
                            <option value="l2" {% if form_data and form_data.Credit_Worthiness == 'l2' %}selected{% endif %}>l2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>open_credit</label>
                        <select name="open_credit">
                            <option value="nopc" {% if form_data and form_data.open_credit == 'nopc' %}selected{% endif %}>nopc</option>
                            <option value="opc" {% if form_data and form_data.open_credit == 'opc' %}selected{% endif %}>opc</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>business_or_commercial</label>
                        <select name="business_or_commercial">
                            <option value="nob/c" {% if form_data and form_data.business_or_commercial == 'nob/c' %}selected{% endif %}>nob/c</option>
                            <option value="b/c" {% if form_data and form_data.business_or_commercial == 'b/c' %}selected{% endif %}>b/c</option>
                        </select>
                    </div>

                    <!-- Nombres -->
                    <div class="form-group">
                        <label>loan_amount</label>
                        <input type="number" name="loan_amount" value="{{ form_data.loan_amount if form_data else 200000 }}" required>
                    </div>
                    <div class="form-group">
                        <label>term</label>
                        <input type="number" name="term" value="{{ form_data.term if form_data else 360 }}" required>
                    </div>
                    <div class="form-group">
                        <label>property_value</label>
                        <input type="number" name="property_value" value="{{ form_data.property_value if form_data else 250000 }}">
                    </div>
                    <div class="form-group">
                        <label>income</label>
                        <input type="number" name="income" value="{{ form_data.income if form_data else 5000 }}">
                    </div>
                    <div class="form-group">
                        <label>Credit_Score</label>
                        <input type="number" name="Credit_Score" value="{{ form_data.Credit_Score if form_data else 700 }}" min="300" max="900">
                    </div>
                    <div class="form-group">
                        <label>LTV</label>
                        <input type="number" step="0.1" name="LTV" value="{{ form_data.LTV if form_data else 80.0 }}">
                    </div>
                    <div class="form-group">
                        <label>dtir1</label>
                        <input type="number" step="0.1" name="dtir1" value="{{ form_data.dtir1 if form_data else 40.0 }}">
                    </div>

                    <!-- Autres sélects -->
                    <div class="form-group">
                        <label>Neg_ammortization</label>
                        <select name="Neg_ammortization">
                            <option value="not_neg" {% if form_data and form_data.Neg_ammortization == 'not_neg' %}selected{% endif %}>not_neg</option>
                            <option value="neg_amm" {% if form_data and form_data.Neg_ammortization == 'neg_amm' %}selected{% endif %}>neg_amm</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>interest_only</label>
                        <select name="interest_only">
                            <option value="not_int" {% if form_data and form_data.interest_only == 'not_int' %}selected{% endif %}>not_int</option>
                            <option value="int_only" {% if form_data and form_data.interest_only == 'int_only' %}selected{% endif %}>int_only</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>lump_sum_payment</label>
                        <select name="lump_sum_payment">
                            <option value="not_lpsm" {% if form_data and form_data.lump_sum_payment == 'not_lpsm' %}selected{% endif %}>not_lpsm</option>
                            <option value="lpsm" {% if form_data and form_data.lump_sum_payment == 'lpsm' %}selected{% endif %}>lpsm</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>construction_type</label>
                        <select name="construction_type">
                            <option value="sb" {% if form_data and form_data.construction_type == 'sb' %}selected{% endif %}>sb</option>
                            <option value="mh" {% if form_data and form_data.construction_type == 'mh' %}selected{% endif %}>mh</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>occupancy_type</label>
                        <select name="occupancy_type">
                            <option value="pr" {% if form_data and form_data.occupancy_type == 'pr' %}selected{% endif %}>pr</option>
                            <option value="sr" {% if form_data and form_data.occupancy_type == 'sr' %}selected{% endif %}>sr</option>
                            <option value="ir" {% if form_data and form_data.occupancy_type == 'ir' %}selected{% endif %}>ir</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Secured_by</label>
                        <select name="Secured_by">
                            <option value="home" {% if form_data and form_data.Secured_by == 'home' %}selected{% endif %}>home</option>
                            <option value="land" {% if form_data and form_data.Secured_by == 'land' %}selected{% endif %}>land</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>total_units</label>
                        <select name="total_units">
                            <option value="1U" {% if form_data and form_data.total_units == '1U' %}selected{% endif %}>1U</option>
                            <option value="2U" {% if form_data and form_data.total_units == '2U' %}selected{% endif %}>2U</option>
                            <option value="3U" {% if form_data and form_data.total_units == '3U' %}selected{% endif %}>3U</option>
                            <option value="4U" {% if form_data and form_data.total_units == '4U' %}selected{% endif %}>4U</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>credit_type</label>
                        <select name="credit_type">
                            <option value="EXP" {% if form_data and form_data.credit_type == 'EXP' %}selected{% endif %}>EXP</option>
                            <option value="EQUI" {% if form_data and form_data.credit_type == 'EQUI' %}selected{% endif %}>EQUI</option>
                            <option value="CRIF" {% if form_data and form_data.credit_type == 'CRIF' %}selected{% endif %}>CRIF</option>
                            <option value="CIB" {% if form_data and form_data.credit_type == 'CIB' %}selected{% endif %}>CIB</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>co-applicant_credit_type</label>
                        <select name="co-applicant_credit_type">
                            <option value="CIB" {% if form_data and form_data.co-applicant_credit_type == 'CIB' %}selected{% endif %}>CIB</option>
                            <option value="EXP" {% if form_data and form_data.co-applicant_credit_type == 'EXP' %}selected{% endif %}>EXP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>age</label>
                        <select name="age">
                            <option value="<25" {% if form_data and form_data.age == '<25' %}selected{% endif %}> &lt;25</option>
                            <option value="25-34" {% if form_data and form_data.age == '25-34' %}selected{% endif %}>25-34</option>
                            <option value="35-44" {% if form_data and form_data.age == '35-44' %}selected{% endif %}>35-44</option>
                            <option value="45-54" {% if form_data and form_data.age == '45-54' %}selected{% endif %}>45-54</option>
                            <option value="55-64" {% if form_data and form_data.age == '55-64' %}selected{% endif %}>55-64</option>
                            <option value="65-74" {% if form_data and form_data.age == '65-74' %}selected{% endif %}>65-74</option>
                            <option value=">74" {% if form_data and form_data.age == '>74' %}selected{% endif %}> &gt;74</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>submission_of_application</label>
                        <select name="submission_of_application">
                            <option value="to_inst" {% if form_data and form_data.submission_of_application == 'to_inst' %}selected{% endif %}>to_inst</option>
                            <option value="not_inst" {% if form_data and form_data.submission_of_application == 'not_inst' %}selected{% endif %}>not_inst</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Region</label>
                        <select name="Region">
                            <option value="North" {% if form_data and form_data.Region == 'North' %}selected{% endif %}>North</option>
                            <option value="south" {% if form_data and form_data.Region == 'south' %}selected{% endif %}>south</option>
                            <option value="central" {% if form_data and form_data.Region == 'central' %}selected{% endif %}>central</option>
                            <option value="North-East" {% if form_data and form_data.Region == 'North-East' %}selected{% endif %}>North-East</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Security_Type</label>
                        <select name="Security_Type">
                            <option value="direct" {% if form_data and form_data.Security_Type == 'direct' %}selected{% endif %}>direct</option>
                            <option value="Indriect" {% if form_data and form_data.Security_Type == 'Indriect' %}selected{% endif %}>Indriect</option>
                        </select>
                    </div>
                </div>

                <button type="submit">🔍 Prédire le Risque de Défaut</button>
            </form>

            {% if result %}
            <div class="result {% if result.prediction == 1 %}danger{% else %}success{% endif %}">
                <h2>{{ result.label }}</h2>
                <h1 style="font-size: 3.5rem; margin: 15px 0;">{{ result.proba_default }}%</h1>
                <p><strong>Niveau de risque :</strong> {{ result.risque_niveau }}</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
